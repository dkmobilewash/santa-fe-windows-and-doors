<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{pageDescription}}">
  {{> robots}}
  {{> canonical}}
  <meta property="og:title" content="{{pageTitle}}">
  <meta property="og:description" content="{{pageDescription}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:site_name" content="{{name}}">
  <meta property="og:locale" content="en_US">
  <meta property="og:image" content="{{domain}}/assets/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{name}}: window and door replacement in Santa Fe, NM">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{pageTitle}}">
  <meta name="twitter:description" content="{{pageDescription}}">
  <meta name="twitter:image" content="{{domain}}/assets/img/og-image.jpg">
  <meta name="theme-color" content="#12284a">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/img/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <!-- Structured data (HomeAndConstructionBusiness, BreadcrumbList, FAQPage) is generated by build.js from site.config.json -->
  {{> schema}}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{> header}}
  <main id="main">
    {{> content}}
  </main>
  {{> footer}}
  <script src="/assets/js/main.js" defer></script>
</body>
</html>
